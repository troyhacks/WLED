; WLED-MM - the ESP32-S31 environment for the pure ESP-IDF build.
;
; The S31 is a P4-class chip with a radio of its own.  ESP-IDF 6.1 knows it
; (components/soc/esp32s31), and the pioarduino platform that carries that
; IDF knows it too, so the pure IDF build can target it the same way it
; targets the P4.
;
; What the chip has:
;   - RISC-V, two cores (a high-performance core and a low-power one)
;   - Wi-Fi 6 and Bluetooth, on the chip: no hosted C6 coprocessor
;   - a gigabit Ethernet MAC, and the board has a gigabit PHY (a YT8531DC)
;     on the chip's RGMII interface
;   - USB OTG (host and device) and a USB-Serial-JTAG
;   - PPA, DMA2D, a JPEG codec, a Parallel IO block, an SDMMC slot
;   - octal PSRAM on a bus of its own
;
; What is different from the P4 environment:
;   - the Wi-Fi is the chip's own, so there is no esp_hosted - and the
;     Wi-Fi and the Ethernet live side by side without a coprocessor in
;     between.  WLED_USE_ETHERNET_ONLY is still an option, but it is not
;     what this board wants.
;   - the Ethernet is RGMII and gigabit, not the P4's RMII: the pins and
;     the PHY are the board's own (see wled00/wled.cpp)
;   - the PSRAM is octal, not hex
;   - there is no HDMI display path, and no P4 vector assembly: the .S files
;     in the application component are P4-only (see wled00/CMakeLists.txt)
;
; The chip is a bring-up part in the IDF's terms (it selects
; IDF_ENV_BRINGUP), so the download stub is off by default there - the
; PlatformIO uploader does not read that setting, so --no-stub is given
; here as well.  The ROM loader is part of the silicon and cannot be wrong
; about the memory map.

[esp32s31_idf_common]
; The same platform as the P4 environments: ESP-IDF 6.1.1 on the 61.x line.
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board                   = esp32-s31-devkitc-1-idf
framework               = espidf
; The Arduino libraries (AsyncTCP, ESPAsyncWebServer, NeoPixelBus, LovyanGFX)
; declare "frameworks": "arduino" in their library.json, and PlatformIO drops
; a library whose declared frameworks do not intersect the env's framework in
; both `soft` and `strict` compatibility mode.  Under ESP-IDF they are built
; against our own Arduino compatibility layer instead.
lib_compat_mode         = off
; LovyanGFX is here for its sprite: the ProLink effect and the analyser
; draw their text into one (the PPA then blends it).  The display path it
; would drive is the P4's, but the sprite is plain software.
lib_deps                = https://github.com/Makuna/NeoPixelBus#CORE3
                          https://github.com/softhack007/FastLED.git#ESP32-C6
                          https://github.com/troyhacks/ESPAsyncWebServer
                          https://github.com/lovyan03/LovyanGFX
lib_ignore              = IRremoteESP8266
                          WebServer
board_build.flash_mode  = qio
monitor_speed           = 115200
; A DTR falling edge resets the chip, and Windows drops DTR when the port
; closes - an asserted DTR means "close the terminal" == "reboot".
monitor_dtr             = 0  ; the jury is still out on this one. :)
upload_speed            = 921600
monitor_filters         = esp32_exception_decoder
extra_scripts           = pre:pio-scripts/set_version.py
                          pre:pio-scripts/fix_gitignore.py
                          pre:pio-scripts/patch_dwc2_cache_sync.py
                          pre:pio-scripts/patch_platform_shell_flags.py
                          pre:pio-scripts/patch_asyncws_client_lock.py
                          pre:pio-scripts/patch_nexpixelbus_s31.py
                          pre:pio-scripts/platformio_version.py
                          pre:pio-scripts/build-html.py
                          pre:pio-scripts/touch_cmake.py
                          pre:pio-scripts/env_sdkconfig.py
                          pre:pio-scripts/lib_include_dirs.py
                          post:pio-scripts/output_bins.py
                          post:pio-scripts/strip-floats.py
                          pre:pio-scripts/user_config_copy.py
                          pre:pio-scripts/fix_codepage.py

; The sdkconfig chain for this environment:
;   sdkconfig.defaults              the settings every chip shares
;   sdkconfig.esp32s31_idf.defaults this chip's settings
; (pio-scripts/env_sdkconfig.py puts them together; the chip's file comes
; last, so it wins.)
sdkconfig_family       = esp32s31

[esp32s31_idf_flags]
; The ESP32-S31, built as a native ESP-IDF firmware.
build_flags           =   -Ofast
                          -funroll-loops
                          -fstrict-volatile-bitfields
                          -ffunction-sections
                          -fdata-sections
                          -Wl,--gc-sections
                          -fvisibility=hidden
                          -fno-semantic-interposition
                          -fno-exceptions
                          -fno-unwind-tables
                          -fno-asynchronous-unwind-tables
                          -fno-jump-tables
                          -fmerge-all-constants
                          -Wl,--defsym=_cleanup_r=0
                          ; The Arduino libraries and the WLED sources expect
                          ; the Arduino environment macros.  The Arduino core
                          ; is gone, but the macros still decide which code
                          ; path a third-party library takes.
                          -D ARDUINO=10819
                          -D ARDUINO_ARCH_ESP32
                          -D ESP32=1
                          -D ESP_PLATFORM=1
                          -D WLED_MAX_USERMODS=25
                          -D WLEDMM_FASTPATH
                          -D WLEDMM_REMAP_AT_OUTPUT
                          -D WLED_DANGEROUS_OPTIMIZATIONS
                          -D IMAGECACHE_BG_PRIORITY=1
                          -D CORE_DEBUG_LEVEL=0
                          ;; The Ethernet: the board has a gigabit PHY (a
                          ;; YT8531DC) on the chip's RGMII interface, so the
                          ;; internal EMAC brings it up.  The Wi-Fi stays
                          ;; available next to it - the S31 has a radio of its
                          ;; own, so there is no hosted coprocessor to keep
                          ;; out of the way (that is what the Ethernet-only
                          ;; mode is for on the P4).
                          ;;
                          ;; WLED_USE_ETHERNET_ONLY is still here as an
                          ;; option: it leaves the Wi-Fi off entirely.
                          -D WLED_USE_ETHERNET
                          ; -D WLED_USE_ETHERNET_ONLY
                          -D E131_MAX_UNIVERSE_COUNT=50
                          -D MAX_LEDS=99999
                          -D MAX_LEDS_PER_BUS=99999
                          -D MAX_LED_MEMORY=64000000
                          -D DEFAULT_LED_TYPE=TYPE_NET_ARTNET_RGB
                          -D WLED_USE_PSRAM
                          -D WLED_USE_MY_CONFIG
                          -D FASTLED_NO_FASTLED
                          -D WLED_RELEASE_NAME=ESP32-S31_16MB
                          -D WLED_WATCHDOG_TIMEOUT=10 ;; was 100
                          -D USERMOD_AUDIOREACTIVE
                        ;   -D USERMOD_ARTNETMAP
                          -D USERMOD_AUTO_PLAYLIST
                          -D USERMOD_PIONEER_PROLINK_V3
                          -D USERMOD_DENON_STAGELINQ
                          -D USERMOD_ABLETON_LINK
                          ; The control surfaces (the MIDI and the HID usermods)
                          ; are not here: they need the USB host, and the
                          ; host's mass storage part - the component that
                          ; carries it does not know the S31 yet - takes the
                          ; whole block with it.  See the note in
                          ; wled00/wled.cpp.
                          ;
                          ; The AudioReactive's audio input: the ES8311 codec
                          ; on the S31's EV function board, at mic level (19).
                          ; Its pins are the ones the Arduino core's
                          ; variants/esp32s31/pins_arduino.h has:
                          ;   I2S  MCLK 52, SCLK 53, LRCK 55,
                          ;        DIN 54 (the codec's data out - the one the
                          ;        AudioReactive reads), DOUT 56
                          ;   I2C  SDA 51, SCL 50 (the codec's own bus)
                          -D SR_DMTYPE=19
                          -D SR_ENABLE_DEFAULT
                          -D MCLK_PIN=52
                          -D I2S_CKPIN=53
                          -D I2S_WSPIN=55
                          -D I2S_SDPIN=54
                          -D HW_PIN_SDA=51
                          -D HW_PIN_SCL=50
                          -D WLED_DISABLE_ESPNOW
                          -D WLED_DISABLE_IMPROV_WIFISCAN
                          -g

[env:esp32s31_idf]
platform                = ${esp32s31_idf_common.platform}
board                   = ${esp32s31_idf_common.board}
framework               = ${esp32s31_idf_common.framework}
lib_compat_mode         = ${esp32s31_idf_common.lib_compat_mode}
lib_deps                = ${esp32s31_idf_common.lib_deps}
lib_ignore              = ${esp32s31_idf_common.lib_ignore}
board_build.flash_mode  = ${esp32s31_idf_common.board_build.flash_mode}
monitor_speed           = ${esp32s31_idf_common.monitor_speed}
monitor_dtr             = ${esp32s31_idf_common.monitor_dtr}
upload_speed            = ${esp32s31_idf_common.upload_speed}
upload_flags            = --no-stub
monitor_filters         = ${esp32s31_idf_common.monitor_filters}
extra_scripts           = ${esp32s31_idf_common.extra_scripts}
sdkconfig_family        = ${esp32s31_idf_common.sdkconfig_family}
build_flags             = ${esp32s31_idf_flags.build_flags}
