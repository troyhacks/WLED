; WLED-MM-P4 - the pure ESP-IDF build environments.
;
; These envs build the same firmware as the Arduino envs, but with the Arduino
; framework replaced by ESP-IDF.  The tree is a real ESP-IDF project:
;
;   CMakeLists.txt        the IDF project root
;   wled00/               the WLED application component (app_main)
;   components/wled_platform/ the platform layer: the clock, the IP address
;                            class, the filesystem, the portable C++ classes
;   components/wled_compat/  the Arduino API layer, backed by IDF drivers
;   sdkconfig.defaults    the IDF configuration
;   partitions.csv        the partition table
;   idf_component.yml     the managed components
;
; PlatformIO drives the build, so the pio-scripts/ toolchain, the flash loop
; and the CI all keep working; but nothing in the firmware comes from the
; Arduino core any more.
;
; The Arduino envs are untouched and stay the default until this one is proven.

[esp32p4_idf_common]
; platform                = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board                   = esp32-p4-evboard-wled-idf
framework               = espidf
; The Arduino libraries (AsyncTCP, ESPAsyncWebServer, NeoPixelBus, LovyanGFX)
; declare "frameworks": "arduino" in their library.json, and PlatformIO drops
; a library whose declared frameworks do not intersect the env's framework in
; both `soft` and `strict` compatibility mode.  Under ESP-IDF they are built
; against our own Arduino compatibility layer instead.
lib_compat_mode         = off
lib_deps                = https://github.com/Makuna/NeoPixelBus#CORE3
                          https://github.com/softhack007/FastLED.git#ESP32-C6
                          https://github.com/troyhacks/ESPAsyncWebServer
                          https://github.com/lovyan03/LovyanGFX
lib_ignore              = IRremoteESP8266
                          WebServer
board_build.flash_mode  = qio
monitor_speed           = 115200
; A DTR falling edge resets the P4 (rst:0x17) and Windows drops DTR when the
; port closes - an asserted DTR means "close the terminal" == "reboot".
monitor_dtr             = 0
upload_speed            = 921600
monitor_filters         = esp32_exception_decoder
extra_scripts           = pre:pio-scripts/set_version.py
                          pre:pio-scripts/platformio_version.py
                          pre:pio-scripts/build-html.py
                          pre:pio-scripts/touch_cmake.py
                          pre:pio-scripts/env_sdkconfig.py
                          pre:pio-scripts/lib_include_dirs.py
                          post:pio-scripts/output_bins.py
                          post:pio-scripts/strip-floats.py
                          pre:pio-scripts/user_config_copy.py
                          pre:pio-scripts/fix_codepage.py

[esp32p4_idf_flags]
; The WLED-MM-P4, built as a native ESP-IDF firmware.
build_flags           =   -Ofast
                          -funroll-loops
                          -fstrict-volatile-bitfields
                          -ffunction-sections
                          -fdata-sections
                          -Wl,--gc-sections
                          -fvisibility=hidden
                          -fno-semantic-interposition
                          -fno-exceptions
                          -fno-unwind-tables
                          -fno-asynchronous-unwind-tables
                          -fno-jump-tables
                          -fmerge-all-constants
                          -Wl,--defsym=_cleanup_r=0
                          ; The Arduino libraries and the WLED sources expect
                          ; the Arduino environment macros.  The Arduino core
                          ; is gone, but the macros still decide which code
                          ; path a third-party library takes.
                          -D ARDUINO=10819
                          -D ARDUINO_ARCH_ESP32
                          -D ESP32=1
                          -D ESP_PLATFORM=1
                          -D WLED_MAX_USERMODS=25
                          -D WLEDMM_FASTPATH
                          -D WLEDMM_REMAP_AT_OUTPUT
                          -D WLEDMM_DISPLAY_MODE=P4_1280x720_60HZ
                          -D WLED_DANGEROUS_OPTIMIZATIONS
                          -D IMAGECACHE_BG_PRIORITY=1
                          -D CORE_DEBUG_LEVEL=0
                          -D WLED_USE_ETHERNET
                          -D WLED_USE_ETHERNET_ONLY
                          -D E131_MAX_UNIVERSE_COUNT=50
                          -D FAKE_DEFINE_159
                          -D MAX_LEDS=99999
                          -D MAX_LEDS_PER_BUS=99999
                          -D MAX_LED_MEMORY=64000000
                          -D DEFAULT_LED_TYPE=TYPE_NET_ARTNET_RGB
                          -D LEDPIN=192
                          -D WLED_USE_PSRAM
                          -D WLED_USE_MY_CONFIG
                          -D FASTLED_NO_FASTLED
                          -D WLED_RELEASE_NAME=ESP32-P4_16MB
                          -D WLED_WATCHDOG_TIMEOUT=100
                          -D USERMOD_AUDIOREACTIVE
                        ;   -D USERMOD_ARTNETMAP
                          -D USERMOD_AUTO_PLAYLIST
                          -D USERMOD_PIONEER_PROLINK_V3
                          -D USERMOD_DENON_STAGELINQ
                          -D USERMOD_ABLETON_LINK
                          -D USERMOD_MIDI_USB
                          -D SR_DMTYPE=10
                          -D SR_ENABLE_DEFAULT
                          -D WLED_DISABLE_ESPNOW
                          -D WLED_DISABLE_IMPROV_WIFISCAN
                          -g

[env:esp32p4_idf]
platform                = ${esp32p4_idf_common.platform}
board                   = ${esp32p4_idf_common.board}
framework               = ${esp32p4_idf_common.framework}
lib_compat_mode         = ${esp32p4_idf_common.lib_compat_mode}
lib_deps                = ${esp32p4_idf_common.lib_deps}
lib_ignore              = ${esp32p4_idf_common.lib_ignore}
board_build.flash_mode  = ${esp32p4_idf_common.board_build.flash_mode}
monitor_speed           = ${esp32p4_idf_common.monitor_speed}
monitor_dtr             = ${esp32p4_idf_common.monitor_dtr}
upload_speed            = ${esp32p4_idf_common.upload_speed}
monitor_filters         = ${esp32p4_idf_common.monitor_filters}
extra_scripts           = ${esp32p4_idf_common.extra_scripts}
build_flags             = ${esp32p4_idf_flags.build_flags}

[env:esp32p4_idf_hidctl]
; The same firmware with the USB HID control surface instead of the deck.
platform                = ${esp32p4_idf_common.platform}
board                   = ${esp32p4_idf_common.board}
framework               = ${esp32p4_idf_common.framework}
lib_compat_mode         = ${esp32p4_idf_common.lib_compat_mode}
lib_deps                = ${esp32p4_idf_common.lib_deps}
lib_ignore              = ${esp32p4_idf_common.lib_ignore}
board_build.flash_mode  = ${esp32p4_idf_common.board_build.flash_mode}
monitor_speed           = ${esp32p4_idf_common.monitor_speed}
monitor_dtr             = ${esp32p4_idf_common.monitor_dtr}
upload_speed            = ${esp32p4_idf_common.upload_speed}
monitor_filters         = ${esp32p4_idf_common.monitor_filters}
extra_scripts           = ${esp32p4_idf_common.extra_scripts}
build_flags             = ${esp32p4_idf_flags.build_flags}
                          -D USERMOD_HIDCTL_USB

[env:esp32p4_idf_rev3]
; The same firmware for the ESP32-P4 rev 3 (and later), which has a
; different SRAM map - ESP-IDF's support for the two is mutually exclusive.
;
; The board is a copy of the other one with "chip_variant": "esp32p4"
; instead of "esp32p4_es", and that is not a detail: the builder picks the
; linker scripts from it (sections.rev3.ld.in and bootloader.rev3.ld.in),
; so the old variant would link the new layout with the old scripts.
;
; The settings that differ are in sdkconfig.esp32p4_idf_rev3.defaults, and
; pio-scripts/env_sdkconfig.py puts that file after the shared defaults.
; Everything else - the sources, the flags, the partition table - is the
; same as the other environments.
platform                = ${esp32p4_idf_common.platform}
board                   = esp32-p4-evboard-wled-idf-rev3
framework               = ${esp32p4_idf_common.framework}
lib_compat_mode         = ${esp32p4_idf_common.lib_compat_mode}
lib_deps                = ${esp32p4_idf_common.lib_deps}
lib_ignore              = ${esp32p4_idf_common.lib_ignore}
board_build.flash_mode  = ${esp32p4_idf_common.board_build.flash_mode}
monitor_speed           = ${esp32p4_idf_common.monitor_speed}
monitor_dtr             = ${esp32p4_idf_common.monitor_dtr}
upload_speed            = ${esp32p4_idf_common.upload_speed}
monitor_filters         = ${esp32p4_idf_common.monitor_filters}
extra_scripts           = ${esp32p4_idf_common.extra_scripts}
build_flags             = ${esp32p4_idf_flags.build_flags}
