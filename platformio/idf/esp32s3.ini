; WLED-MM - the ESP32-S3 environment for the pure ESP-IDF build.
;
; The S3 is the oldest chip in this tree, and the first one that was not a
; P4-class part: a plain Xtensa dual core at 240 MHz, with a radio of its
; own (Wi-Fi and Bluetooth), a USB OTG, and an octal PSRAM on the same bus
; as the flash.  ESP-IDF 6.1 knows it as a first-class target
; (components/soc/esp32s3), so the pure IDF build can target it the same way
; it targets the P4 and the S31.
;
; What the chip has:
;   - Xtensa, two cores, at 240 MHz
;   - Wi-Fi and Bluetooth, on the chip: no hosted C6 coprocessor
;   - USB OTG (host and device) and a USB-Serial-JTAG
;   - an SDMMC slot, a JTAG, a camera interface, an LCD interface
;   - octal PSRAM, on the same SPI bus as the flash
;
; What is different from the P4 and the S31:
;   - the Ethernet is SPI: a W5500 module.  The chip does have an internal
;     MAC, but no board has a PHY on it - the S3's boards that have
;     Ethernet have a W5500 module on them, on SPI.  The IDF's W5500 driver
;     is the registry component espressif/w5500.
;   - the PSRAM is octal, like the S31's, and it shares the bus with the
;     flash - so the flash runs at 80 MHz and the PSRAM at 80 MHz.
;   - there is no display path, no Parallel IO block and no P4 vector
;     assembly: the .S files in the application component are P4-only (see
;     wled00/CMakeLists.txt)
;   - the LED bus is driven over RMT (the IDF's own driver).  The I2S
;     method is written for the classic ESP32's I2S, and NeoPixelBus
;     excludes the S3 from it by itself.
;
; The board is an ESP32-S3-DevKitC-1 with 16 MB of quad flash and 8 MB of
; octal PSRAM, and the console is on UART0 (GPIO43 TX, GPIO44 RX) - most
; of these boards have a USB-UART bridge on it, not the native USB.

[esp32s3_idf_common]
; The same platform as the P4 and S31 environments: ESP-IDF 6.1.1 on the
; 61.x line.
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board                   = esp32-s3-devkitc-1-idf
framework               = espidf
; The Arduino libraries (AsyncTCP, ESPAsyncWebServer, NeoPixelBus, LovyanGFX)
; declare "frameworks": "arduino" in their library.json, and PlatformIO drops
; a library whose declared frameworks do not intersect the env's framework in
; both `soft` and `strict` compatibility mode.  Under ESP-IDF they are built
; against our own Arduino compatibility layer instead.
lib_compat_mode         = off
; LovyanGFX is here for its sprite: the ProLink effect and the analyser
; draw their text into one (the PPA then blends it).  The display path it
; would drive is the P4's, but the sprite is plain software.
lib_deps                = https://github.com/Makuna/NeoPixelBus#CORE3
                          https://github.com/softhack007/FastLED.git#ESP32-C6
                          https://github.com/troyhacks/ESPAsyncWebServer
                          https://github.com/lovyan03/LovyanGFX
lib_ignore              = IRremoteESP8266
                          WebServer
board_build.flash_mode  = qio
monitor_speed           = 115200
; A DTR falling edge resets the chip, and Windows drops DTR when the port
; closes - an asserted DTR means "close the terminal" == "reboot".
monitor_dtr             = 0  ; the jury is still out on this one. :)
upload_speed            = 921600
monitor_filters         = esp32_exception_decoder
extra_scripts           = pre:pio-scripts/set_version.py
                          pre:pio-scripts/fix_gitignore.py
                          pre:pio-scripts/patch_dwc2_cache_sync.py
                          pre:pio-scripts/patch_platform_shell_flags.py
                          pre:pio-scripts/patch_asyncws_client_lock.py
                          pre:pio-scripts/patch_nexpixelbus_s3.py
                          pre:pio-scripts/platformio_version.py
                          pre:pio-scripts/build-html.py
                          pre:pio-scripts/touch_cmake.py
                          pre:pio-scripts/env_sdkconfig.py
                          pre:pio-scripts/lib_include_dirs.py
                          post:pio-scripts/output_bins.py
                          post:pio-scripts/strip-floats.py
                          pre:pio-scripts/user_config_copy.py
                          pre:pio-scripts/fix_codepage.py

; The sdkconfig chain for this environment:
;   sdkconfig.defaults               the settings every chip shares
;   sdkconfig.esp32s3_idf.defaults   this chip's settings
; (pio-scripts/env_sdkconfig.py puts them together; the chip's file comes
; last, so it wins.)
sdkconfig_family       = esp32s3

[esp32s3_idf_flags]
; The ESP32-S3, built as a native ESP-IDF firmware.
build_flags           =   -Ofast
                          -funroll-loops
                          -fstrict-volatile-bitfields
                          -ffunction-sections
                          -fdata-sections
                          -Wl,--gc-sections
                          -fvisibility=hidden
                          -fno-semantic-interposition
                          -fno-exceptions
                          -fno-unwind-tables
                          -fno-asynchronous-unwind-tables
                          -fno-jump-tables
                          -fmerge-all-constants
                          -Wl,--defsym=_cleanup_r=0
                          ; The Arduino libraries and the WLED sources expect
                          ; the Arduino environment macros.  The Arduino core
                          ; is gone, but the macros still decide which code
                          ; path a third-party library takes.
                          -D ARDUINO=10819
                          -D ARDUINO_ARCH_ESP32
                          -D ARDUINO_ARCH_ESP32S3
                          -D ESP32=1
                          -D ESP_PLATFORM=1
                          -D WLED_MAX_USERMODS=25
                          -D WLEDMM_FASTPATH
                          -D WLEDMM_REMAP_AT_OUTPUT
                          -D WLED_DANGEROUS_OPTIMIZATIONS
                          -D IMAGECACHE_BG_PRIORITY=1
                          -D CORE_DEBUG_LEVEL=0
                          -D E131_MAX_UNIVERSE_COUNT=50
                          ; The S3 has 8 MB of PSRAM and 320 KB of RAM -
                          ; the LED buffers come out of the PSRAM, and the
                          ; counts are the ones that fit in it.
                          -D MAX_LEDS=8192
                          -D MAX_LEDS_PER_BUS=8192
                          -D MAX_LED_MEMORY=4000000
                          -D DEFAULT_LED_TYPE=TYPE_NET_ARTNET_RGB
                          -D WLED_USE_PSRAM
                          -D WLED_USE_MY_CONFIG
                          -D FASTLED_NO_FASTLED
                          -D WLED_RELEASE_NAME=ESP32-S3_16MB
                          -D WLED_WATCHDOG_TIMEOUT=10 ;; was 100
                          ; The native HUB75 driver: a panel driven straight
                          ; from the chip's own pins.  The S3 has no PARLIO,
                          ; so it drives the panel over LCD_CAM only.
                          -D WLED_ENABLE_HUB75
                          -D USERMOD_AUTO_PLAYLIST
                        ;   -D USERMOD_ARTNETMAP
                          ; The AudioReactive is compiled in but not
                          ; enabled: the auto-playlist usermod reads its
                          ; numbers, so it has to be there.  The I2S pins
                          ; are a property of the board, and almost no S3
                          ; board has an audio codec on it - so it stays
                          ; off until someone turns it on from the web UI.
                          -D USERMOD_AUDIOREACTIVE
                        ; -D SR_ENABLE_DEFAULT
                          -D WLED_DISABLE_ESPNOW
                          -D WLED_DISABLE_IMPROV_WIFISCAN
                          -g

[env:esp32s3_idf]
platform                = ${esp32s3_idf_common.platform}
board                   = ${esp32s3_idf_common.board}
framework               = ${esp32s3_idf_common.framework}
lib_compat_mode         = ${esp32s3_idf_common.lib_compat_mode}
lib_deps                = ${esp32s3_idf_common.lib_deps}
lib_ignore              = ${esp32s3_idf_common.lib_ignore}
board_build.flash_mode  = ${esp32s3_idf_common.board_build.flash_mode}
monitor_speed           = ${esp32s3_idf_common.monitor_speed}
monitor_dtr             = ${esp32s3_idf_common.monitor_dtr}
upload_speed            = ${esp32s3_idf_common.upload_speed}
monitor_filters         = ${esp32s3_idf_common.monitor_filters}
extra_scripts           = ${esp32s3_idf_common.extra_scripts}
sdkconfig_family        = ${esp32s3_idf_common.sdkconfig_family}
build_flags             = ${esp32s3_idf_flags.build_flags}
