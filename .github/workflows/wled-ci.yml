name: PlatformIO CI

on: [push, pull_request]

jobs:

  get_default_envs:
    name: Gather Environments
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install PlatformIO
      run: pip install -r requirements.txt
    - name: Get default environments
      id: envs
      run: |
        echo "environments=$(pio project config --json-output | jq -cr '.[0][1][0][1]')" >> $GITHUB_OUTPUT
    outputs:
      environments: ${{ steps.envs.outputs.environments }}


  build:
    name: Builds
    runs-on: ubuntu-22.04
    needs: get_default_envs
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.get_default_envs.outputs.environments) }}
    steps:
    - uses: actions/checkout@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ matrix.environment}}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: false
    - name: Install dependencies
      run: |
        uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.18.zip
        pio pkg install --global --environment ${{ matrix.environment }}
    - name: Build firmware
      env:
        WLED_RELEASE: True
      run: pio run -e ${{ matrix.environment }}
    - name: Rename Bin
      run: |
        mv -v .pio/build/${{ matrix.environment }}/firmware.bin firmware-${{ matrix.environment }}.bin
        if [ -f .pio/build/${{ matrix.environment }}/firmware.factory.bin ]; then
          mv -v .pio/build/${{ matrix.environment }}/firmware.factory.bin firmware-${{ matrix.environment }}.factory.bin
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: firmware-${{ matrix.environment }}*.bin
    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: firmware-release-${{ matrix.environment }}
        path: build_output/release/*.bin
  latest:
    # The newest build of the published branch on this repo's GitHub Pages under latest/: the bins and an ESP Web Tools
    # manifest.json naming WLED's version with the build date and commit, which a web installer reads (Pages sends CORS);
    # a pushed tag still makes the stable draft release below
    name: Publish latest build
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/P4_Experimental_Dev'
    permissions:
      contents: read
    concurrency:
      group: latest
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: package.json
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@v4
      with:
        pattern: firmware-*
        merge-multiple: true
    - name: Stage the bins and their manifest for Pages
      run: |
        mkdir -p site/latest && cp firmware-*.bin site/latest/
        python3 - <<'PY'
        import glob, json, os, re, datetime
        version = json.load(open("package.json"))["version"]
        builds = []
        for path in sorted(glob.glob("site/latest/firmware-*.factory.bin")):
            name = os.path.basename(path)
            chip = re.match(r"firmware-esp32([a-z]\d+)?", name, re.I).group(1)   # esp32p4_8MB_... -> p4, esp32_... -> none
            builds.append({"chipFamily": "ESP32" + (f"-{chip.upper()}" if chip else ""), "parts": [{"path": name, "offset": 0}]})
        built = f"build {datetime.date.today().isoformat()} {os.environ['GITHUB_SHA'][:8]}"
        manifest = {"name": f"WLED {os.environ['GITHUB_REF_NAME']}", "version": f"{version} {built}", "builds": builds}
        json.dump(manifest, open("site/latest/manifest.json", "w"), indent=2)
        print(json.dumps(manifest, indent=2))
        PY
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
  pages:
    # Its own job after the upload, as GitHub's Pages workflow template has it, so the artifact is listed when deploy-pages asks
    name: Deploy latest to Pages
    runs-on: ubuntu-22.04
    needs: latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}latest/
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
    - id: pages
      uses: actions/deploy-pages@v4
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [get_default_envs, build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/download-artifact@v4
    - name: List Artifacts
      run: find ./ -type f -name *.bin -exec mv -v {} ./ \;
    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        draft: True
        files: |
          WLEDMM*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
