; PlatformIO Project Configuration File — pure IDF build for ESP32-P4.
; All compile definitions live in wled00/CMakeLists.txt; build_flags here are
; for PlatformIO tooling awareness only.

[platformio]
default_envs = esp32p4_8MB_idf
src_dir      = ./wled00
data_dir     = ./wled00/data
build_cache_dir = ~/.platformio/buildcache

[env:esp32p4_8MB_idf]
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework               = espidf
board                   = esp32-p4-evboard
board_build.sdkconfig   = sdkconfig.p4.defaults
board_build.partitions  = tools/WLED_ESP32_8MB_1500KB_FS.csv

; NOTE: build_flags here are largely ignored by the IDF CMake build.
; All compile definitions and options live in wled00/CMakeLists.txt.
; The flags below are kept for PlatformIO tooling awareness only.
build_flags             = -Ofast
                          -ffast-math
                          -mstrict-align
                          -D WLED_IDF_BUILD
                          -D memcpy_P=memcpy
                          -D memcmp_P=memcmp
                          -D CONFIG_IDF_TARGET_ESP32P4=1
                          -D ESP32=1
                          -D ARDUINO=10819
                          -D WLED_MAX_USERMODS=25
                          -D WLEDMM_FASTPATH
                          -D WLEDMM_REMAP_AT_OUTPUT
                          -D WLEDMM_DISPLAY_MODE=P4_1280x720_60HZ
                          -D WLEDMM_DISPLAY_BUTTONS=32
                          -D WLEDMM_DISPLAY_BUTTONS_COLS=8
                          -D REALTIME_OUTPUT_TIMER
                          -D WLED_USE_ETHERNET
                          -D WLED_USE_ETHERNET_ONLY
                          -D BOARD_HAS_PSRAM
                          -D WLED_USE_PSRAM
                          -D MAX_LEDS=99999
                          -D MAX_LEDS_PER_BUS=99999
                          -D MAX_LED_MEMORY=64000000
                          -D DEFAULT_LED_TYPE=TYPE_NET_ARTNET_RGB
                          -D LEDPIN=192
                          -D E131_MAX_UNIVERSE_COUNT=50
                          -D ARTNET_TIMER
                          -D FASTLED_NO_FASTLED
                          -D FASTLED_ESP32_I2S
                          -D WLED_RELEASE_NAME=ESP32-P4_IDF
                          -D WLED_WATCHDOG_TIMEOUT=100
                          -D USERMOD_AUDIOREACTIVE
                          -D USERMOD_AUTO_PLAYLIST
                          -D USERMOD_PIONEER_PROLINK
                          -D USERMOD_ARTNETMAP
                          -D UM_AUDIOREACTIVE_USE_ESPDSP_FFT
                          -D SR_DMTYPE=9
                          -D SR_ENABLE_DEFAULT
                          -D WLED_DISABLE_ESPNOW
                          -D WLED_DISABLE_IMPROV_WIFISCAN
                          -D CORE_DEBUG_LEVEL=0
                          -D NDEBUG
                          -D FAKE_DEFINE_1
                          -D PARLIO_PINS=2,3,4,5,6,20,21,22,23,26,27,32,33,36,47,48
                          -D WLED_DANGEROUS_OPTIMIZATIONS
                          -D WLED_USE_MY_CONFIG
                          -Wno-deprecated-declarations
                          -Wno-attributes
                          -g
                          -I${PROJECT_DIR}/wled00/idf_shims
lib_deps                = https://github.com/lovyan03/LovyanGFX
                          fastled/FastLED @ 3.6.0
lib_compat_mode         = off
monitor_filters         = esp32_exception_decoder
monitor_speed           = 115200
upload_speed            = 921600
