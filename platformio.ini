; Espressif ESP32-P4 EV Board default GPIO layout:
;
; GPIO    | Assigned to           | Info
; --------|-----------------------|------------
; i/o   2   Parallel IO
; i/o   3   Parallel IO
; i/o   4   Parallel IO
; i/o   5   Parallel IO             
; i/o   6   Parallel IO             ESP32-C6 wakeup (usable)
; i/o   7   I2C (hw)                I2C SDA
; i/o   8   I2C (hw)                I2C SCL
; i/o  10   AudioReactive (UM)      (default) I2S WS
; i/o  11   AudioReactive (UM)      (default) I2S SD
; i/o  12   AudioReactive (UM)      (default) I2S SCK
; i/o  13   AudioReactive (UM)      (default) I2S MCLK
; i/o  20   Parallel IO
; i/o  21   Parallel IO             
; i/o  22   Parallel IO
; i/o  23   Parallel IO
; i/o  26   Parallel IO             Extra USB (usable)
; i/o  27   Parallel IO             Extra USB (usable)
; i/o  32   Parallel IO             
; i/o  33   Parallel IO
; i/o  36   Parallel IO             (strapping pin)
; i/o  37   debug output            Serial TX
; i/o  38   ./.                     Serial RX
; i/o  46   ./.                     (default) Button pin
; i/o  47   Parallel IO
; i/o  48   Parallel IO
; i/o  53   ./.                     Audio Amp Enable (usable)
; WLED initialization done.