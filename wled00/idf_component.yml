dependencies:
  espressif/esp-dsp:
    rules:
    - if: target == esp32p4
    version: ^1.7.0
  espressif/esp_codec_dev:
    version: ^1.5.1
  espressif/esp_hosted:
    rules:
    - if: target == esp32p4
    version: ^2.12.0
  espressif/esp_lcd_lt8912b:
    version: ^0.2.0
  espressif/esp_wifi_remote:
    rules:
    - if: target == esp32p4
    version: ^1.2.2
  espressif/lan867x:
    rules:
    - if: target in [esp32, esp32p4]
    version: ^2.0.0
  espressif/usb_host_msc:
    rules:
    - if: target == esp32p4
    version: ^1.1.3
  idf: '>=5.3'
  joltwallet/littlefs:
    version: ^1.10.2
  espressif/mdns:
    version: "^1.8.0"
  espressif/esp_h264:
    version: "^1.0.0"
    rules:
    - if: target == esp32p4
