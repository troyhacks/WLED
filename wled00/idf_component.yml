## Managed IDF components for the pure ESP-IDF WLED build.
##
## This file lives in the main component's directory because that is where
## the IDF component manager looks for the project's manifest.
##
## The versions are pinned to the ones the Arduino core pulls in today
## (framework-arduinoespressif32-libs/esp32p4/dependencies.lock), so the pure
## IDF build gets the same component versions the Arduino build gets - the
## ES8311 init sequence, the C6 hosted link and the panel drivers all behave
## the same way.
##
## The Arduino core reaches these through its own idf_component.yml; without a
## core there is nothing to pull them in, so the project has to ask for them.
##
## The dependencies at the bottom are the ESP32-P4's own hardware, and they
## are conditional: the component manager's "rules" say that a dependency
## with a rule is only there when the rule holds, and the rule here is the
## chip that is being built.  Without that, the S31 build would pull in the
## P4's display drivers (which the registry lists as esp32p4-only), the
## H.264 decoder (which has prebuilt libraries per chip) and the hosted
## coprocessor (which the S31 does not need - it has a radio of its own).
##
## NOTE: the chip name in a rule is NOT quoted.  The component manager's
## if-parser takes the items of the list as they are written, so
## "target in ['esp32p4']" is a list with one item that is not the name of
## any chip - it never matches, and the dependency is skipped for every
## target.  "target in [esp32p4]" is the form that works.

dependencies:
  idf: ">=6.1,<6.2"

  # AudioReactive: the FFT (esp-dsp) and the ES8311 codec control.
  #
  # esp-dsp has no optimized code for the S31, so it falls back to its ANSI
  # C implementation there - slower, but the same numbers.
  espressif/esp-dsp: "1.7.1"
  espressif/esp_codec_dev: "1.5.4"

  # The filesystem.  The port brings the esp_vfs wrapper with it.
  joltwallet/littlefs: "1.23.3"

  # mDNS is a managed component, not a built-in one.
  espressif/mdns: "1.10.1"

  # The USB host stack: the control surfaces (the MIDI and the HID usermods)
  # and the AudioReactive's USB audio client are built on it.  It is a
  # dependency of the USB mass storage host as well, but that one is the
  # P4's (see below), so it is asked for here in its own right.
  espressif/usb: "1.6.1"

  # --- the ESP32-P4's own hardware ------------------------------------------
  #
  # The hosted coprocessor (the C6, reached over SDIO), the HDMI bridge and
  # the MIPI-DSI panels behind it, the software H.264 decoder for it, the
  # IP101 Ethernet PHY and the USB mass storage host.
  #
  # All of it is the P4's board, and none of it builds on the other chips in
  # this tree: the panel drivers are esp32p4-only in the registry, the H.264
  # decoder ships prebuilt libraries per chip, and the USB mass storage host
  # does not know the S31.
  espressif/esp_hosted:
    version: "3.1.0"
    rules:
      - if: target in [esp32p4]
  espressif/esp_lcd_lt8912b:
    version: "0.2.0"
    rules:
      - if: target in [esp32p4]
  espressif/esp_lcd_ek79007:
    version: "2.0.2"
    rules:
      - if: target in [esp32p4]
  espressif/esp_lcd_ili9881c:
    version: "1.1.0"
    rules:
      - if: target in [esp32p4]
  waveshare/esp_lcd_st7703:
    version: "2.0.0"
    rules:
      - if: target in [esp32p4]
  espressif/esp_h264:
    version: "1.0.4"
    rules:
      - if: target in [esp32p4]
  espressif/ip101:
    version: "1.1.0"
    rules:
      - if: target in [esp32p4]
  espressif/usb_host_msc:
    version: "1.1.4"
    rules:
      - if: target in [esp32p4]

  # --- the ESP32-S31's own hardware ------------------------------------------
  #
  # The Ethernet PHY on the S31's board: a YT8531DC, a gigabit part, on the
  # chip's RGMII interface.  Its driver left the IDF in 6.0 too - it is the
  # registry component espressif/yt8531 now, the same as the IP101 above.
  espressif/yt8531:
    version: "0.2.0"
    rules:
      - if: target in [esp32s31]
