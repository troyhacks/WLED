<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<title>WLED Settings</title>
	<script>
		var d=document;
		var loc = false, locip;
		var umPages = []; // available dedicated usermod settings pages

		function gId(n){return d.getElementById(n);}
		// https://www.educative.io/edpresso/how-to-dynamically-load-a-js-file-in-javascript
		function loadJS(FILE_URL, async = true) {
			let scE = d.createElement("script");
			scE.setAttribute("src", FILE_URL);
			scE.setAttribute("type", "text/javascript");
			scE.setAttribute("async", async);
			d.body.appendChild(scE);
			// success event
			scE.addEventListener("load", () => {
				//console.log("File loaded");
				GetV();
			});
			// error event
			scE.addEventListener("error", (ev) => {
				console.log("Error on loading file", ev);
				alert("Loading of configuration script failed.\nIncomplete page data!");
			});
		}
		function isO(i) { return (i && typeof i === 'object' && !Array.isArray(i)); }

		// Fetch list of available dedicated usermod settings pages
		async function loadUmPages() {
			try {
				const res = await fetch('/json/usermod-pages');
				if (res.ok) {
					umPages = await res.json();
				}
			} catch (e) {
				console.log('Could not load usermod pages:', e);
			}
		}

		// Get display label for a usermod page name
		function getPageLabel(name) {
			// Convert snake_case or camelCase to Title Case
			return name.replace(/_/g, " ").replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\b\w/g, l => l.toUpperCase());
		}

		// load settings and insert values into DOM
		async function ldS() {
			// First load available usermod pages
			await loadUmPages();

			var url = (loc?`http://${locip}`:'') + '/cfg.json';
			fetch(url, {
				method: 'get'
			})
			.then(res => {
				if (!res.ok) gId('lserr').style.display = "inline";
				return res.json();
			})
			.then(json => {
        umCfg = json.um;
        urows = "";

        // First add dedicated usermod settings pages (from registry)
        for (const page of umPages) {
          let label = getPageLabel(page);
          urows += `<button type="submit" onclick="window.location='./settings_${page}'">${label} (UM ◆)</button>`;
        }

        // Then add usermods from cfg.json that don't have dedicated pages
        if (isO(umCfg)) {
          for (const [k, o] of Object.entries(umCfg)) {
            // Skip if this usermod has a dedicated page
            if (umPages.includes(k)) continue;
            let label = k.replace(/_/g, " ");
            urows += `<button type="submit" onclick="window.location=\'./settings/um?um=${k}\'">${label} (UM ☾)</button>`;
          }
        }
        gId("configMenu").innerHTML = urows;
        var url = (loc ? `http://${locip}` : '') + '/settings/s.js?p=0';
        loadJS(url, false);	// If we set async false, file is loaded and executed, then next statement is processed
      })
        .catch((error) => {
				gId('lserr').style.display = "inline";
				console.log(error);
			});
		}
		function S(){
			if (window.location.protocol == "file:") {
				loc = true;
				locip = localStorage.getItem('locIp');
				if (!locip) {
					locip = prompt("File Mode. Please enter WLED IP!");
					localStorage.setItem('locIp', locip);
				}
			}
			//WLEDMM: add ldS and move loadJS there (like in settings_um)
			ldS();
		}
	</script>
	<style>
		body {
			text-align: center;
			background: #222;
			height: 100px;
			margin: 0;
		}
		html {
			--h: 9vh;
		}
		button {
			background: #333;
			color: #fff;
			font-family: Verdana, Helvetica, sans-serif;
			display: block;
			border: 1px solid #333;
			border-radius: var(--h);
			font-size: 6vmin;
			/* height: var(--h); WLEDMM remove to allow more compact display*/
			width: calc(100% - 40px);
			margin: 2vh auto 0;
			cursor: pointer;
		}
	</style>
</head>
<body onload="S()">
<button type=submit id="b" onclick="window.location='/'">Back</button>
<button type="submit" onclick="window.location='./settings/wifi'">Wi-Fi Setup</button>
<button type="submit" onclick="window.location='./settings/leds'">LED Preferences</button>
<button id="2dbtn" style="display:none;" type="submit" onclick="window.location='./settings/2D'">2D Configuration</button>
<div id="configMenu">Loading...</div>
<button type="submit" onclick="window.location='./settings/um'">Usermods (pins)</button> <!--WLEDMM: Move below UMs-->
<button type="submit" onclick="window.location='./settings/ui'">User Interface</button>
<button id="dmxbtn" style="display:none;" type="submit" onclick="window.location='./settings/dmx'">DMX Output</button>
<button type="submit" onclick="window.location='./settings/sync'">Sync Interfaces</button>
<button type="submit" onclick="window.location='./settings/time'">Time &amp; Macros</button>
<button type="submit" onclick="window.location='./settings/sec'">Security &amp; Updates</button>
<button type="submit" onclick="window.location='./edit'">File System ☾</button> <!--WLEDMM-->
</body>
</html>
