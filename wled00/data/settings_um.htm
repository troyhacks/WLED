<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Usermod Settings</title>
<script src="/alpine.min.js" defer></script>
<script src="/settings-core.js"></script>
<style>@import url("style.css");</style>
</head>
<body>
<div x-data="umPage()" x-init="init()">
  <div class="toprow">
    <div class="helpB"><button type="button" onclick="window.open('https://github.com/Aircoookie/WLED/wiki/Settings#usermod-settings')">?</button></div>
    <button type="button" onclick="window.open('/settings','_self')">Back</button>
    <button type="button" @click="save()" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
    <hr>
  </div>

  <div x-show="error" x-text="error" style="color:red;margin:8px 0;"></div>
  <div x-show="saved" style="color:green;margin:8px 0;">&#10004; Configuration saved!</div>
  <div x-show="loading" style="color:#aaa;">Loading settings...</div>

  <!-- Global I2C/SPI Pins (hidden when filtered to specific usermod) -->
  <div x-show="!loading && !umFilter">
    <hr>
    <h2>Usermods (Pin Manager)</h2>
    <button type="button" onclick="window.open('https://mm.kno.wled.ge/usermods/pinmanager')">?</button>
    <hr class="sml">
    <i style="color:orange">(change requires reboot!)</i>
    <hr class="sml">
    <p><u>Global I2C GPIOs (HW)</u></p>
    SDA pin: <select x-model.number="cfg.if.i2c.SDA"><template x-for="o in pinOptions(-1)" :key="o.n"><option :value="o.n" :disabled="o.dis" x-text="o.label"></option></template></select><br>
    SCL pin: <select x-model.number="cfg.if.i2c.SCL"><template x-for="o in pinOptions(-1)" :key="o.n"><option :value="o.n" :disabled="o.dis" x-text="o.label"></option></template></select><br>
    <hr class="sml">
    <p><u>Global SPI GPIOs (HW)</u></p>
    MOSI pin: <select x-model.number="cfg.if.spi.MOSI"><template x-for="o in pinOptions(-1)" :key="o.n"><option :value="o.n" :disabled="o.dis" x-text="o.label"></option></template></select><br>
    MISO pin: <select x-model.number="cfg.if.spi.MISO"><template x-for="o in pinOptions(-1)" :key="o.n"><option :value="o.n" :disabled="o.dis" x-text="o.label"></option></template></select><br>
    SCLK pin: <select x-model.number="cfg.if.spi.SCLK"><template x-for="o in pinOptions(-1)" :key="o.n"><option :value="o.n" :disabled="o.dis" x-text="o.label"></option></template></select><br>
  </div>

    <!-- Usermod sections -->
    <template x-for="[modName, modCfg] in umEntries()" :key="modName">
      <div>
        <hr>
        <h3 x-text="modName" style="display:inline;"></h3>
        <button type="button" x-show="hasSchema(modName)" style="margin-left:8px;" @click="openHelp(modName)">?</button>
        <br>
        <template x-for="field in buildFields(modName, modCfg)" :key="field.path">
          <div>
            <!-- Group header -->
            <template x-if="field.type === 'group'">
              <p><u x-text="field.label"></u></p>
            </template>
            <!-- Boolean / checkbox -->
            <template x-if="field.type === 'bool'">
              <span>
                <span x-text="field.label"></span>:
                <input type="checkbox" :checked="getVal(field.path)" @change="setVal(field.path, $event.target.checked)">
                <br>
              </span>
            </template>
            <!-- GPIO pin selector -->
            <template x-if="field.type === 'gpio' || field.isPin">
              <span>
                <span x-text="field.label"></span>:
                <select :value="getVal(field.path)" @change="setVal(field.path, parseInt($event.target.value))">
                  <template x-for="o in pinOptions(getVal(field.path))" :key="o.n">
                    <option :value="o.n" :disabled="o.dis" x-text="o.label"></option>
                  </template>
                </select><br>
              </span>
            </template>
            <!-- Integer number -->
            <template x-if="field.type === 'int'">
              <span>
                <span x-text="field.label"></span>:
                <input type="number" class="xxl" :min="field.min ?? ''" :max="field.max ?? ''"
                  :value="getVal(field.path)"
                  @input="setVal(field.path, parseInt($event.target.value))"><br>
              </span>
            </template>
            <!-- Float number -->
            <template x-if="field.type === 'float'">
              <span>
                <span x-text="field.label"></span>:
                <input type="number" class="xxl" step="any" :min="field.min ?? ''" :max="field.max ?? ''"
                  :value="getVal(field.path)"
                  @input="setVal(field.path, parseFloat($event.target.value))"><br>
              </span>
            </template>
            <!-- Select / enum -->
            <template x-if="field.type === 'select'">
              <span>
                <span x-text="field.label"></span>:
                <select :value="getVal(field.path)" @change="setVal(field.path, $event.target.value)">
                  <template x-for="opt in field.options" :key="opt.value">
                    <option :value="opt.value" x-text="opt.label"></option>
                  </template>
                </select><br>
              </span>
            </template>
            <!-- String / text -->
            <template x-if="field.type === 'string'">
              <span>
                <span x-text="field.label"></span>:
                <input type="text" style="width:250px;"
                  :value="getVal(field.path)"
                  @input="setVal(field.path, $event.target.value)"><br>
              </span>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- Summary table -->
    <hr>
    <div style="margin:auto;">
      <table style="margin-left:auto;margin-right:auto;">
        <tr><th>Usermod</th><th>Enabled</th></tr>
        <template x-for="[k, o] in umEntries()" :key="k">
          <tr>
            <td x-text="k"></td>
            <td x-text="o.enabled !== undefined ? String(o.enabled) : 'n/a'"></td>
          </tr>
        </template>
      </table>
    </div>
  </div>

  <hr>
  <button type="button" onclick="window.open('/settings','_self')">Back</button>
  <button type="button" @click="save()" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
</div>

<script>
function initCap(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/[\W_]/g, ' ').replace(/(^\w{1})|(\s+\w{1})/g, l => l.toUpperCase());
}

function isPin(key) {
  return key.replace('[]','').slice(-3) === 'pin';
}

function guessType(key, val) {
  if (typeof val === 'boolean') return 'bool';
  if (typeof val === 'string') return 'string';
  if (isPin(key)) return 'gpio';
  if (typeof val === 'number') return Number.isInteger(val) ? 'int' : 'float';
  return 'string';
}

// Special field options for known usermod fields (when no schema available)
function specialOptions(modName, path) {
  if (modName !== 'AudioReactive') return [];
  if (path === 'AudioReactive.digitalmic.type') {
    return [
      { value: '254', label: 'None - network receive only' },
      { value: '0', label: 'Generic Analog' },
      { value: '1', label: 'Generic I2S' },
      { value: '2', label: 'ES7243' },
      { value: '3', label: 'SPH0654' },
      { value: '4', label: 'Generic I2S with Mclk' },
      { value: '5', label: 'Generic I2S PDM' },
      { value: '51', label: 'Legacy I2S PDM' },
    ];
  }
  if (path === 'AudioReactive.config.AGC') {
    return [
      { value: '0', label: 'Off' },
      { value: '1', label: 'Normal' },
      { value: '2', label: 'Vivid' },
    ];
  }
  if (path === 'AudioReactive.experiments.micLev') {
    return [
      { value: '0', label: 'Floating' },
      { value: '1', label: 'Freeze' },
      { value: '2', label: 'Fast Freeze' },
    ];
  }
  if (path === 'AudioReactive.experiments.Mic_Quality') {
    return [
      { value: '0', label: 'average (standard)' },
      { value: '1', label: 'low noise' },
      { value: '2', label: 'perfect' },
    ];
  }
  if (path === 'AudioReactive.experiments.FFT_Window') {
    return [
      { value: '0', label: 'Hanning' },
      { value: '1', label: 'Hamming' },
      { value: '2', label: 'Blackman' },
    ];
  }
  if (path === 'AudioReactive.frequency.profile') {
    return [
      { value: '0', label: 'Vocals' },
      { value: '1', label: 'Instrumental' },
      { value: '2', label: 'Linear' },
    ];
  }
  return [];
}

function flattenUM(obj, modName, schema, prefix) {
  // Returns array of field descriptor objects
  const fields = [];
  if (!obj || typeof obj !== 'object') return fields;
  const schemaFields = schema?.fields;
  for (const [k, v] of Object.entries(obj)) {
    const path = prefix ? `${prefix}.${k}` : `${modName}.${k}`;
    const sf = schemaFields?.find(f => f.key === k);
    if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
      fields.push({ type: 'group', label: initCap(k), path });
      fields.push(...flattenUM(v, modName, null, path));
    } else if (Array.isArray(v)) {
      if (v.length > 0 && isPin(k)) {
        v.forEach((item, i) => {
          fields.push({ type: 'gpio', isPin: true, label: `${initCap(k)} ${i}`, path: `${path}.${i}`, value: item });
        });
      }
      // Otherwise skip arrays we don't know how to handle
    } else {
      const opts = sf?.options || specialOptions(modName, path);
      fields.push({
        type: opts.length > 0 ? 'select' : (sf?.type || guessType(k, v)),
        isPin: !sf && isPin(k),
        label: sf?.label || initCap(k),
        min: sf?.min, max: sf?.max,
        options: opts,
        path
      });
    }
  }
  return fields;
}

function umPage() {
  return {
    ...wledPageBase(8),
    cfg: { if: { i2c: { SDA: -1, SCL: -1 }, spi: { MOSI: -1, MISO: -1, SCLK: -1 } }, um: {} },
    schema: {},
    gpio: { rsvd: [], ro_gpio: [], um_p: [], max_gpio: 55, dt_pins: [], a_pins: [] },
    loading: true,
    umFilter: new URLSearchParams(window.location.search).get('um'),

    async init() {
      const data = await this._load();
      if (!data) { this.loading = false; return; }
      if (data._gpio) this.gpio = data._gpio;
      if (data._schema) this.schema = data._schema;
      if (!data.if) data.if = { i2c: { SDA: -1, SCL: -1 }, spi: { MOSI: -1, MISO: -1, SCLK: -1 } };
      if (!data.um) data.um = {};
      this.cfg = data;
      this.loading = false;
    },

    umEntries() {
      const entries = Object.entries(this.cfg.um || {});
      if (!this.umFilter) return entries;
      return entries.filter(([k]) => k === this.umFilter);
    },

    hasSchema(modName) {
      return !!this.schema[modName];
    },

    openHelp(modName) {
      window.open(`https://mm.kno.wled.ge/usermods/${modName}`);
    },

    buildFields(modName, modCfg) {
      return flattenUM(modCfg, modName, this.schema[modName]);
    },

    // Path is like "AudioReactive.enabled" or "AudioReactive.group.pin"
    getVal(path) {
      const parts = path.split('.');
      let obj = this.cfg.um;
      for (const p of parts) {
        if (obj === undefined || obj === null) return undefined;
        obj = obj[p];
      }
      return obj;
    },

    setVal(path, value) {
      const parts = path.split('.');
      let obj = this.cfg.um;
      for (let i = 0; i < parts.length - 1; i++) {
        if (obj[parts[i]] === undefined) obj[parts[i]] = {};
        obj = obj[parts[i]];
      }
      obj[parts[parts.length-1]] = value;
    },

    pinOptions(currentVal) {
      const gpio = this.gpio;
      const rsvd = gpio.rsvd || [];
      const ro = gpio.ro_gpio || [];
      const used = gpio.um_p || [];
      const dtPins = gpio.dt_pins || [];
      const aPins = gpio.a_pins || [];
      const max = gpio.max_gpio || 55;
      const opts = [{ n: -1, label: 'Undefined', dis: false }];
      for (let i = 0; i <= max; i++) {
        const isRsvd = rsvd.includes(i);
        const isRo = ro.includes(i);
        const isUsed = used.includes(i) && i !== currentVal;
        let label = String(i);
        // Add DX / AX labels
        const di = dtPins.indexOf(i);
        if (di >= 0) label += di < 9 ? ` D${di}` : (di === 9 ? ' RX' : ' TX');
        const ai = aPins.indexOf(i);
        if (ai >= 0) label += ` A${ai}`;
        if (isRsvd) label += ' reserved 🟣';
        else if (isRo) label += ' read only 🟠';
        else if (isUsed) label += ' (in use)';
        else label += ' 🟢';
        opts.push({ n: i, label, dis: isRsvd });
      }
      return opts;
    },

    async save() {
      const payload = {
        if: this.cfg.if,
        um: this.cfg.um
      };
      await this._save(payload);
    }
  };
}
</script>
</body>
</html>
