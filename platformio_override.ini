  ; -D MAX_LEDS_PER_BUS=8192
  -D LEDPIN=9
  -D DEFAULT_LED_COLOR_ORDER=0
  -D DEFAULT_LED_COUNT=256
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D IRPIN=-1
  -D IRTYPE=0
  -D AUDIOPIN=-1
  -D FLD_PIN_SCL=-1
  -D FLD_PIN_SDA=-1
  -D HW_PIN_SCL=-1
  -D HW_PIN_SDA=-1
  -D HW_PIN_CLOCKSPI=-1
  -D HW_PIN_MOSISPI=-1
  -D HW_PIN_MISOSPI=-1
  -D SR_DMTYPE=5
  -D I2S_USE_16BIT_SAMPLES
