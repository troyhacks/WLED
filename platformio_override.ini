lib_compat_mode         = strict
extra_scripts           = pre:pio-scripts/set_version.py
                          pre:pio-scripts/build-html.py
                          post:pio-scripts/output_bins.py
                          post:pio-scripts/strip-floats.py
                          pre:pio-scripts/user_config_copy.py
                          ; pre:pio-scripts/load_usermods.py
                          ; pre:pio-scripts/build_ui.py
                          ; post:pio-scripts/validate_modules.py  ;; double-check the build output usermods

[env:esp32p4_8MB_troyhacks]
build_src_filter =      +<**/*.c>
                        +<**/*.cpp>
                        +<**/*.S>
                        -<**/dmx*>
                        -<**/async-mqtt-client/**>
                        -<**/methods/Esp32_i2s*>
                        -<**/espalexa/**>
                        -<**/DS1307RTC*>
                        -<**/dependencies/dmx>
                        -<**/LovyanGFX/lgfx/v1/platforms/**>
                        -<**/LovyanGFX/lgfx/v1/panel/**>
                        -<**/LovyanGFX/lgfx/v1/touch/**> 
platform                = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip ;; https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip ;; https://github.com/troyhacks/platform-espressif32#Arduino/IDF5
platform_packages       = framework-arduinoespressif32 @ https://github.com/troyhacks/arduino-esp32#feature/esp32p4
                          framework-arduinoespressif32-libs @ https://github.com/troyhacks/esp32-arduino-libs#main ;; 9d3db693436d2ff6244d7c981a7f19b22382bb62 ;; main ;; #d0dae8c20ba9ada0c0c3d488a8262ba0f07299bc ;; 
                          ; toolchain-riscv32-esp @ https://github.com/espressif/crosstool-NG/releases/download/esp-14.2.0_20241119/riscv32-esp-elf-14.2.0_20241119-x86_64-w64-mingw32.zip
; board_build.arduino.upstream_packages = no
board                   = esp32-p4-evboard
build_unflags           = -O2
                          -D CONFIG_LWIP_TCPIP_TASK_AFFINITY
                          -D CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU0
                          -D CONFIG_ARDUINO_RUNNING_CORE
                          -D CONFIG_ARDUINO_EVENT_RUNNING_CORE
                          -fno-tree-switch-conversion
build_flags           =   -Ofast                             ;; -O3 + -ffast-math + aggressive opts
                          -funroll-loops                     ;; more aggressive loop unrolling than -Ofast alone
                          -fno-threadsafe-statics            ;; remove mutex guards on local static init
                          -fstrict-volatile-bitfields        ;; use field width for volatile bitfield access (hardware regs)
                          -flto                              ;; must be in build_flags; enable_lto.py runs too late for the compiler
                          -fipa-pta                          ;; interprocedural pointer analysis; requires LTO
                          -ffunction-sections                ;; isolate functions for linker GC
                          -fdata-sections                    ;; isolate data for linker GC
                          -Wl,--gc-sections                  ;; linker dead-code elimination; most effective with LTO
                          -fvisibility=hidden                ;; hidden symbols by default; LTO inlines/eliminates more aggressively
                          -fno-semantic-interposition        ;; no symbol interposition assumed; more cross-TU inlining with LTO
                          -fno-exceptions                    ;; drop C++ exception handling code
                          -fno-rtti                          ;; drop C++ runtime type information
                          -fno-unwind-tables                 ;; no unwind tables; safe since exceptions are disabled
                          -fno-asynchronous-unwind-tables    ;; no async unwind tables; safe since exceptions are disabled
                          -fno-jump-tables                   ;; avoid jump tables in flash (Xtensa i-cache unfriendly)
                          -fmerge-all-constants              ;; deduplicate identical constants across translation units
                          ; -mtext-section-literals          ;; inline literals in text; bloats flash on Xtensa, leave disabled
                          -Wl,--defsym=_cleanup_r=0          ;; stub out newlib cleanup (bare-metal, no OS to return to)
                          ; -D WLED_ENABLE_COLORLIGHT  
                          -D WLED_MAX_USERMODS=25
                          -D WLEDMM_FASTPATH
                          -D WLEDMM_REMAP_AT_OUTPUT
                          -D USERMOD_ARTNETMAP
                          -D WLEDMM_DISPLAY_MODE=P4_1280x720_60HZ   ;; HDMI output mode (see hdmi_mode_t in wled_hdmi.h)
                          ; -D WLEDMM_DISPLAY_W=800       ;; DSI Display Width (compile-time default; HDMI mode sets runtime size)
                          ; -D WLEDMM_DISPLAY_H=1280      ;; DSI Display Height (compile-time default; HDMI mode sets runtime size)
                          ; -D WLEDMM_DISPLAY_DEPTH=24    ;; DSI Display Bits Per Pixel (24 for RGB888)
                          ; -D WLEDMM_DISPLAY_BUTTONS=32
                          ; -D WLEDMM_DISPLAY_BUTTONS_COLS=8
                          -D REALTIME_OUTPUT_TIMER
                          ; -D WLED_DISABLE_LOGGING
                          ; -D PARLIO_TIMER
                          ; -D PARLIO_AUTO_OVERCLOCK
                          -D WLED_DANGEROUS_OPTIMIZATIONS
                          -D CONFIG_ARDUINO_RUNNING_CORE=0
                          -D CONFIG_ARDUINO_EVENT_RUNNING_CORE=0
                          -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
                          -D CONFIG_LWIP_TCPIP_TASK_AFFINITY=1
                          -D CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU1=1
                          ; -D ARTNET_PRIORITY=24
                          ; If you don't set PARLIO_PINS it's OK, it just sets all pins to disabled. Still "outputs" tho.
                          ; -D PARLIO_PINS=2,3,4,5,6,20,21,22,23,26,27,32,33,36,47,48 ;; GPIOs beyond 36 require some special ESP32-P4 LDO code or 47,48 don't work- added to WLED::setup()!
                          -D IMAGECACHE_BG_PRIORITY=1 ;; Priority: Recommended 18 or 20 (High, but < Background @ 24).
                          -D CONFIG_OTA_VERSION_FORCE_SLAVEFW
                          ; -D WLED_DEBUG
                          -D CORE_DEBUG_LEVEL=0 ;; ESP_LOG_VERBOSE ;; ESP_LOG_VERBOSE == 5
                          -D NDEBUG ;; comment this out if REALLY debugging for things like Parallel IO, PPA, etc
                          -D WLED_USE_ETHERNET ;; Coexistence is slower but both work now. Ethernet is preferred automatically.
                          -D WLED_USE_ETHERNET_ONLY ;; Disable WiFi for performance reasons - on the P4 it needs high priority background tasks to talk to the C6
                          -D E131_MAX_UNIVERSE_COUNT=50                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                          -D FAKE_DEFINE_159
                          ; -D ARTNET_SYNC_ENABLED ;; reduces tearing with FPP but also slower.
                          -D MAX_LEDS=99999 ;; 65535 ;; 18432
                          -D MAX_LEDS_PER_BUS=99999 ;; 65535 ;; 18432
                          -D MAX_LED_MEMORY=64000000 ;; times ONE HUNDRED
                          -D DEFAULT_LED_TYPE=TYPE_NET_ARTNET_RGB
                          -D LEDPIN=192 ;; at least get 192.x.x.x set properly for Art-Net
                          ; -D BTNPIN=46 ;; Boot button is on GPIO 35 and works as a "button", but polling it messes up Ethernet.
                          -D CONFIG_ASYNC_TCP_TASK_STACK_SIZE=61440
                          -D BOARD_HAS_PSRAM
                          -D WLED_USE_PSRAM
                          ; -D WLED_USE_PSRAM_JSON
                          ; -D ALL_JSON_TO_PSRAM
                          -Wno-deprecated-declarations
                          -Wno-attributes
                          -D ESP_PLATFORM=1
                          -D WLED_USE_MY_CONFIG
                          -g
                          -D FASTLED_NO_FASTLED
                          -D WLED_RELEASE_NAME=ESP32-P4_16MB
                          -D WLED_WATCHDOG_TIMEOUT=100 ;; Setting >0 will make the watchdog not panic. Workaround for now.
                          -D USERMOD_AUDIOREACTIVE
                          -D USERMOD_AUTO_PLAYLIST
                          -D USERMOD_PIONEER_PROLINK_V3
                          -D USERMOD_MIDI_USB ;; WIP usermod for control surfaces like the Akai APC Mini Mk2 (the reference controller)
                          -D UM_AUDIOREACTIVE_USE_ESPDSP_FFT ;; This is redundant, we ONLY use this now - but kept for compatibility with older builds
                          -D SR_DMTYPE=10 ;; 10 = new ES8311 (esp_codec_dev), 9 = ES8311 (org) which is the codec chip on the ESP32-P4 EV board
                          -D SR_ENABLE_DEFAULT
                          ; -D TROYHACKS_FAILSAFE_BUSSES ;; in case you have a bus type causing resets during testing, turn this on, upload, busses will be removed at boot. Then reflash without this flag.
                          -D WLED_DISABLE_ESPNOW ;; not working yet due to API changes in v5.3
                          -D CONFIG_ADC_SUPPRESS_DEPRECATE_WARN
                          -D CONFIG_I2S_SUPPRESS_DEPRECATE_WARN
                          -D WLED_DISABLE_IMPROV_WIFISCAN
                          ; -D SR_DEBUG 
                          ; -D USERMOD_ANIMARTRIX
                          ; -D WLEDMM_NO_MAP_RESET
                          ; -D WLED_DEBUG_MAPS
                          ; -D ES8311_ADDR=0x18
lib_deps                = https://github.com/Makuna/NeoPixelBus#CORE3
                          https://github.com/softhack007/FastLED.git#ESP32-C6
                          https://github.com/troyhacks/ESPAsyncWebServer
                          https://github.com/lovyan03/LovyanGFX
                          ; https://github.com/troyhacks/animartrix.git
lib_ignore              = IRremoteESP8266
                          WebServer
                          ; SD
                          ; SD_MMC
board_build.partitions  = tools/WLED_ESP32_8MB_1500KB_FS.csv ;; WLED_ESP32_8MB.csv
board_build.flash_mode  = qio
monitor_filters         = esp32_exception_decoder, colorize
monitor_speed           = 115200
upload_speed            = 921600
framework               = arduino
lib_compat_mode         = strict
extra_scripts           = pio-scripts/enable_lto.py
                          pre:pio-scripts/set_version.py
                          pre:pio-scripts/platformio_version.py
                          pre:pio-scripts/build-html.py
                          post:pio-scripts/output_bins.py
                          post:pio-scripts/strip-floats.py
                          pre:pio-scripts/user_config_copy.py
                          pre:pio-scripts/fix_codepage.py
                          ; pre:pio-scripts/load_usermods.py
                          ; pre:pio-scripts/build_ui.py
                          ; post:pio-scripts/validate_modules.py  ;; double-check the build output usermods

; Espressif ESP32-P4 EV Board default GPIO layout:
;
; Display, Camera, PSRAM pins are internal on the P4 so no need to route around them!
;
; GPIO    | Assigned to           | Info
; --------|-----------------------|------------
; i/o   2   Parallel IO
; i/o   3   Parallel IO
; i/o   4   Parallel IO
; i/o   5   Parallel IO             
; i/o   6   Parallel IO             ESP32-C6 wakeup (usable)
; i/o   7   I2C (hw)                I2C SDA
; i/o   8   I2C (hw)                I2C SCL
; i/o  10   AudioReactive (UM)      (default) I2S WS
; i/o  11   AudioReactive (UM)      (default) I2S SD
; i/o  12   AudioReactive (UM)      (default) I2S SCK
; i/o  13   AudioReactive (UM)      (default) I2S MCLK
; i/o  20   Parallel IO
; i/o  21   Parallel IO             
; i/o  22   Parallel IO
; i/o  23   Parallel IO
; i/o  26   Parallel IO             Extra USB (usable)
; i/o  27   Parallel IO             Extra USB (usable)
; i/o  32   Parallel IO             
; i/o  33   Parallel IO
; i/o  36   Parallel IO             (strapping pin)
; i/o  37   debug output            Serial TX
; i/o  38   ./.                     Serial RX
; i/o  45   ./.                     *** NA on the EV board, but common on more recent P4 devkits.
; i/o  46   ./.                     (default) Button pin
; i/o  47   Parallel IO
; i/o  48   Parallel IO
; i/o  53   ./.                     Audio Amp Enable (usable)
; WLED initialization done.

