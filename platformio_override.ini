;; ...the build-up of years of TroyHacks experiments.
;; I keep having to recover this so I'm tracking it in Git now. 
;; If it breaks, you get to keep both pieces.
;; You may notice a lot of these don't "extend" anything.  
;; To get the "standalone" env to hack on, run "pio project config > myconfigs.txt"
;; and then pick out the env you want to hack on and fix the env name to be in square brackets.

[env:esp32S3_4MB_S_troyhacks]
extends                 =  esp32_4MB_V4_M_base
board                   =  esp32-s3-devkitc-1
build_unflags           =  -D USERMOD_DALLASTEMPERATURE
build_src_filter =
  +<**/*.c>
  +<**/*.cpp>
  ; -<**/dmx*>
  -<**/async-mqtt-client/**>
  -<**/espalexa/**>
  -<**/DS1307RTC*>
  -<**/dependencies/dmx>
monitor_filters         =  esp32_exception_decoder, colorize
build_flags             =   -Ofast
                            -ffast-math
                            -D WLED_DEBUG
                            -D WLED_DEBUG_HEAP
                            ; -g
                            -D ARDUINO_ARCH_ESP32
                            -D ARDUINO_ARCH_ESP32S3
                            -D ARDUINO_DFU_ON_BOOT=0
                            -D ARDUINO_USB_CDC_ON_BOOT=1
                            -D ARDUINO_USB_DFU_ON_BOOT=0
                            -D ARDUINO_USB_MODE=1
                            -D ARDUINO_USB_MSC_ON_BOOT=0
                            ; -D BEARSSL_SSL_BASIC
                            -D CONFIG_ASYNC_TCP_TASK_STACK_SIZE=10072
                            -D CONFIG_ASYNC_TCP_USE_WDT=0
                            -D CONFIG_IDF_TARGET_ESP32S3=1
                            -D CORE_DEBUG_LEVEL=0
                            -D ESP32
                            -D FASTLED_NO_FASTLED
                            -D LFS_THREADSAFE
                            ; -D CONFIG_LITTLEFS_FOR_IDF_3_2
                            -D MAX_LEDS=16384
                            -D MAX_LEDS_PER_BUS=12288
                            ; -D NDEBUG
                            -D NO_CIE1931
                            -D NO_FAST_FUNCTIONS
                            -D NO_GFX
                            -D S3_LCD_DIV_NUM=20
                            ; -D SECURE_CLIENT=SECURE_CLIENT_BEARSSL
                            -D UM_AUDIOREACTIVE_USE_NEW_FFT
                            ; -D USERMOD_ANIMARTRIX
                            -D USERMOD_AUDIOREACTIVE
                            ; -D USERMOD_AUTO_PLAYLIST
                            ; -D USERMOD_AUTO_SAVE
                            -D WLEDMM_FASTPATH
                            ; -D WLED_DISABLE_ADALIGHT
                            -D JSON_BUFFER_SIZE=18432
                            -D WLED_DISABLE_WEBSOCKETS
                            -D WLED_DISABLE_ALEXA
                            -D WLED_DISABLE_ESPNOW
                            -D WLED_DISABLE_HUESYNC
                            -D WLED_DISABLE_INFRARED
                            -D WLED_DISABLE_LOXONE
                            -D WLED_DISABLE_MQTT
                            -D WLED_ENABLE_HUB75MATRIX
                            -D WLED_RELEASE_NAME=esp32S3_4MB_S
                            -D WLED_USE_MY_CONFIG
                            -D WLED_WATCHDOG_TIMEOUT=0
                            -Wall -Wformat -Woverflow -Wuninitialized -Winit-self -Warray-bounds
                            -Wno-attributes
                            -Wno-deprecated-declarations
                            -Wno-format-truncation
                            -Wno-misleading-indentation
                            -Wno-unused-function
                            -Wno-unused-variable
                            -Wshadow=compatible-local
lib_deps                =   https://github.com/Aircoookie/ESPAsyncWebServer.git @ 2.2.1
                            https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#1e4c80a26454aca7b8129bd5a966b0af329d2703
                            ; https://github.com/netmindz/animartrix.git#18bf17389e57c69f11bc8d04ebe1d215422c7fb7
                            https://github.com/pbolduc/AsyncTCP.git @ 1.2.0
                            https://github.com/softhack007/arduinoFFT.git#develop @ 1.9.2
                            https://github.com/Makuna/NeoPixelBus @ 2.8.2
                            https://github.com/FastLED/FastLED @ 3.7.5
                            paulstoffregen/OneWire@ ^2.3.7
board_build.partitions  =  tools/WLED_ESP32_4MB_1MB_FS.csv
upload_speed            =  460800
platform                =  espressif32@ ~6.8.1
platform_packages       =  platformio/framework-arduinoespressif32 @ 3.20017.0
board_build.f_flash     =  80000000L
board_build.flash_mode  =  qio
framework               =  arduino+
monitor_speed           =  115200
lib_compat_mode         =  strict
extra_scripts           =  pre:pio-scripts/set_version.py
                           pre:pio-scripts/build-html.py
                           post:pio-scripts/output_bins.py
                           post:pio-scripts/strip-floats.py
                           pre:pio-scripts/user_config_copy.py

