  -D I2S_CKPIN=-1
  -D MCLK_PIN=-1
  -D SR_SQUELCH=10
  -D SR_GAIN=60
  -D SR_FREQ_PROF=2
  -D SR_ENABLE_DEFAULT  ;; enable at first start - no need to manually set "enable", then reboot
  -D BOARD_HAS_PSRAM
  -D WLED_USE_PSRAM
  -D WLED_USE_PSRAM_JSON
  -D ALL_JSON_TO_PSRAM
  -D WLED_RELEASE_NAME=esp32S3_2MB_PSRAM_TROYHACKS
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLEDMM_NO_SERIAL_WAIT
  ; -D WLED_DISABLE_ESPNOW
  ; -D WLED_DISABLE_ADALIGHT ; Seems to stop serial *input* on ESP32-S3.
lib_deps =
  https://github.com/pbolduc/AsyncTCP.git @ 1.2.0
  https://github.com/Makuna/NeoPixelBus @ 2.8.3
  https://github.com/FastLED/FastLED#3.7.8
  https://github.com/Aircoookie/ESPAsyncWebServer @ 2.3.0
  ; https://github.com/troyhacks/ETHClass2 @ 1.0.0+sha.851dde6
  ; https://github.com/troyhacks/TroyHacksAsyncUDP
  ; https://github.com/netmindz/animartrix.git#091c6b4055704a2faa2508aad2057755ed871d9f
  https://github.com/softhack007/arduinoFFT.git#develop @ 1.9.2  ;; No longer needed with UM_AUDIOREACTIVE_USE_ESPDSP_FFT ;; used for USERMOD_AUDIOREACTIVE - optimized version, 10% faster on -S2/-C3
