  -D DEFAULT_LED_COLOR_ORDER=1
  -D DEFAULT_LED_COUNT=8
  -D BTNPIN=0
  -D RLYPIN=-1
  -D IRPIN=-1
  -D IRTYPE=0
  -D AUDIOPIN=-1
  -D FLD_PIN_SCL=-1
  -D FLD_PIN_SDA=-1
  -D HW_PIN_SCL=-1
  -D HW_PIN_SDA=-1
  -D HW_PIN_CLOCKSPI=-1
  -D HW_PIN_MOSISPI=-1
  -D HW_PIN_MISOSPI=-1
  -D SR_DMTYPE=1
  -D I2S_SDPIN=4
