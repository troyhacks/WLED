  -D USERMOD_ANIMARTRIX
  ; -D ARTNET_TIMER
  ; -D WLEDMM_SLOWPATH ;; ESP32 only, doesn't do anything for S3
  ; -D ARTNET_TROYHACKS
  ; -D WLEDMM_FIXED_BRIGHT_PREVIEW
  ; -D WLED_USE_ETHERNET
  ; -D WLED_DEBUG
  ; -D WLED_DEBUG_HEAP ;; currently glitches LEDs on S3 with NeoPixelBus
