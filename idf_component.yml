## Managed IDF components for the pure ESP-IDF WLED-MM-P4 build.
##
## The versions are the ones the Arduino core pulls in today
## (framework-arduinoespressif32-libs/esp32p4/dependencies.lock), so the pure
## IDF build gets the same component versions the Arduino build gets - the
## ES8311 init sequence, the C6 hosted link and the panel drivers all behave
## the same way.
##
## The Arduino core reaches these through its own idf_component.yml; without a
## core there is nothing to pull them in, so the project has to ask for them.

dependencies:
  idf: ">=5.5,<5.6"

  # AudioReactive: the FFT (esp-dsp) and the ES8311 codec control.
  espressif/esp-dsp: "^1.7.1"
  espressif/esp_codec_dev: "^1.5.4"

  # The P4 has no radio of its own - the C6 coprocessor is reached over
  # esp-hosted, with esp_wifi_remote in front of it for the Wi-Fi side.
  espressif/esp_hosted: "^2.12.3"
  espressif/esp_wifi_remote: "^1.3.0"

  # mDNS (Arduino's ESPmDNS.h) and the filesystem.
  espressif/mdns: "^1.10.1"
  joltwallet/littlefs: "^5.5.1"

  # Display drivers that the P4 firmware uses.
  espressif/esp_lcd_lt8912b: "^0.2.0"
  espressif/esp_lcd_ek79007: "^2.0.2"
  espressif/esp_lcd_ili9881c: "^1.1.0"
  waveshare/esp_lcd_st7703: "^1.0.1"
